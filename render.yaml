# Render blueprint for the API.
# Create the Blueprint in the Render dashboard and point it at this repository.
# Secret values are marked sync: false - Render prompts for them and stores them
# in its own secret manager. No secret is committed to Git.

services:
  - type: web
    name: ecommerce-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # --include=dev keeps TypeScript and the build tooling available even though
    # NODE_ENV=production is set for the runtime.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # Render terminates TLS and forwards the client IP as one proxy hop.
      - key: TRUST_PROXY
        value: "1"
      # Client (Vercel) and API (Render) are on different sites, so the refresh
      # and CSRF cookies must be SameSite=None (Secure is forced in production).
      - key: COOKIE_SAMESITE
        value: none
      - key: CACHE_DRIVER
        value: redis
      - key: QUEUE_DRIVER
        value: bullmq
      - key: MAIL_DRIVER
        value: smtp
      - key: MONGODB_URI
        sync: false
      # Upstash Redis uses the rediss:// scheme (TLS).
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
